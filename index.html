<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b14"><meta name="description" content="NEON RUSH — dodge, collect and beat your best score.">
<title>NEON RUSH — MIND MASTER</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
<main class="shell">
<header class="top"><a class="brand" href="./"><span class="mark">M</span><span>MIND MASTER</span></a><span class="game-name">NEON RUSH</span></header>
<section class="hud" aria-label="Game statistics"><div><small>SCORE</small><strong id="score">0</strong></div><div><small>BEST</small><strong id="best">0</strong></div><div><small>SPEED</small><strong id="speed">1.0×</strong></div></section>
<section class="stage-wrap">
<canvas id="game" aria-label="Neon Rush game area"></canvas>
<div class="screen" id="startScreen"><div class="orb">◆</div><p class="eyebrow">READY WHEN YOU ARE</p><h1>NEON RUSH</h1><p class="sub">Dodge the blocks. Collect the energy.</p><button id="play">PLAY NOW</button><small>← → / A D or tap the sides</small></div>
<div class="screen hidden" id="overScreen"><p class="eyebrow">RUN COMPLETE</p><h2>GOOD RUN.</h2><p class="result">SCORE <strong id="finalScore">0</strong></p><button id="again">PLAY AGAIN</button><small>Beat your best score.</small></div>
<div class="pause-tag hidden" id="pauseTag">PAUSED</div>
</section>
<nav class="controls" aria-label="Movement controls"><button id="left" aria-label="Move left">←</button><button id="pause" aria-label="Pause game">Ⅱ</button><button id="right" aria-label="Move right">→</button></nav>
<p class="hint">MOVE LEFT OR RIGHT TO DODGE · COLLECT THE GLOWING GEMS</p>
</main>
<script src="app.js?v=5"></script>
<script>if("serviceWorker" in navigator && location.protocol.startsWith("http")) addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));</script>
</body></html>
